// PLUGINS
plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

// SETUP
version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}


sourceSets {
    main {
        resources {
            srcDir 'src/generated/resources'
        }
    }
}

java.toolchain.languageVersion = JavaLanguageVersion.of(java_version)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

// MINECRAFT
minecraft {

    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
        }

        client {
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')

            args '--mod', mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources').getAbsolutePath(),
                    "--existing-mod", "dynamictrees",
                    "--existing-mod", "mr_still_life",
                    "--existing-mod", "vanillabackport"
        }
    }
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        forRepositories(fg.repository) // Uncomment when using ForgeGradle
        filter {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        url 'https://harleyoconnor.com/maven'
    }
}

// DEPENDENCIES
dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    
    // implementation fg.deobf("com.ferreusveritas.dynamictrees:DynamicTrees-${minecraft_version}:${dynamic_trees_version}") only 1.4.10 is available on the maven repo
    implementation fg.deobf("com.ferreusveritas.dynamictreesplus:DynamicTreesPlus-${minecraft_version}:${dynamic_trees_plus_version}")
    implementation fg.deobf("curse.maven:dynamictrees-252818:${dynamic_trees_version_id}")
    implementation fg.deobf("curse.maven:vanillabackport-417430:${vanilla_backport_version_id}")
    implementation "maven.modrinth:${still_life_mod_id}:${still_life_verion_id}"
}

// TASKS
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version:          minecraft_version,
            minecraft_version_range:    minecraft_version_range,
            forge_version:              forge_version,
            forge_version_range:        forge_version_range,
            loader_version_range:       loader_version_range,
            mod_id:                     mod_id,
            mod_name:                   mod_name,
            mod_license:                mod_license,
            mod_version:                mod_version,
            mod_authors:                mod_authors,
            mod_description:            mod_description,
            dynamic_trees_version:      dynamic_trees_version,
            still_life_version:         still_life_version,
            dynamic_trees_plus_version: dynamic_trees_plus_version,
            vanilla_backport_version_id: vanilla_backport_version_id,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}